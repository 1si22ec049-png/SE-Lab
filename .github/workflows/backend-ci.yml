name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: selab_notes_test
          POSTGRES_USER: selab
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U selab -d selab_notes_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 10s
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/selab_notes_test
      TEST_DB_USERNAME: selab
      TEST_DB_PASSWORD: ci-test-password
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17 and cache Maven dependencies
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run backend tests
        run: mvn --batch-mode --no-transfer-progress test

  docker-build:
    name: Build backend Docker image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t selab-notes-backend:ci ./backend